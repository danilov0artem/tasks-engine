<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
{% include head.html %}
</head>

<body>
  {% include header.html %}

  <main class="container layout-main">

  <div class="sidebar">
    <aside class="news-panel card">
      <h2 class="section-title" style="text-align: center;">Новости проекта</h2>

      <div class="news-scroll" id="newsList">
      </div>
    </aside>

    {% if site.contacts %}
    <aside class="contacts-panel card">
      <p class="contacts-text">По всем вопросам, идеям, замечаниям и прочему пишите автору:</p>
      <div class="contacts-links">
        {% if site.contacts.vk %}
        <a class="contacts-link" href="{{ site.contacts.vk }}" target="_blank" rel="noopener">
          <svg class="contacts-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12.94 17.36c-5.36 0-8.91-3.74-9.06-9.86h2.7c.1 4.5 2.16 6.4 3.74 6.79V7.5h2.58v3.85c1.5-.16 3.08-1.91 3.62-3.85h2.55c-.41 2.39-2.12 4.14-3.34 4.86 1.22.58 3.18 2.11 3.94 4.86h-2.81c-.6-1.89-2.05-3.36-3.96-3.55v3.55h-1.96z"/>
          </svg>
          ВКонтакте
        </a>
        {% endif %}
        {% if site.contacts.telegram %}
        <a class="contacts-link" href="{{ site.contacts.telegram }}" target="_blank" rel="noopener">
          <svg class="contacts-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M21.43 3.6 2.6 10.86c-1.28.51-1.27 1.22-.23 1.54l4.83 1.5 1.86 5.71c.23.62.11.86.76.86.5 0 .72-.23.99-.5.18-.17 1.23-1.19 2.4-2.33l4.99 3.69c.92.5 1.58.24 1.8-.85l3.27-15.41c.34-1.34-.5-1.94-1.84-1.47Zm-4.83 4.04L8.77 14.59l-.31 3.3-1.86-5.66 9.62-6.05c.44-.27.84-.13.4.46Z"/>
          </svg>
          Telegram
        </a>
        {% endif %}
      </div>
    </aside>
    {% endif %}
  </div>

  <section class="card tasks-panel">
    {{ content }}
  </section>
  </main>
  <script src="/assets/js/news.js"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
