<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
{% include head.html task_css=true %}

  <!-- MathJax для формул -->
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
          integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei"
          crossorigin="anonymous"></script>

  <script src="/assets/js/theme.js" defer></script>
  {% if page.task_page %}
  <!-- Настройки движка задач из _config.yml сайта (tasks_engine) -->
  <script>window.TASKS_ENGINE = {{ site.tasks_engine | jsonify }};</script>
  <script src="/assets/js/task-page.js" defer></script>
  {% endif %}
</head>

<body>
  {% include header.html %}

  <main class="container">
    <section class="card">
      {% if page.title %}<h1 class="section-title"{% if page.task_page %} id="pageTitle"{% endif %}>{{ page.title }}</h1>{% endif %}
      {% if page.task_page %}
      <h2 class="section-title" style="margin-top: 16px;">Содержание</h2>
      <ul class="link-list toc" id="toc"></ul>
      <div id="themesRoot"></div>
      {% endif %}
      {{ content }}
    </section>
  </main>
</body>
</html>
